<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Quote of the Day</h1>

      <figure class="quote">
        <blockquote><p id="quote-text"></p></blockquote>
        <figcaption id="quote-author"></figcaption>
      </figure>

      <div class="actions">
        <button type="button" id="new-quote">New quote</button>
        <button type="button" id="favorite-toggle" aria-pressed="false" aria-label="Favorite">
          ☆ Favorite
        </button>
      </div>

      <section class="favorites" aria-labelledby="favorites-heading">
        <h2 id="favorites-heading" tabindex="-1">Favorites</h2>
        <!-- The live region exists from page load so screen readers announce text added later. -->
        <div role="status">
          <p id="storage-notice" hidden></p>
        </div>
        <p id="favorites-empty">No favorites yet</p>
        <ul id="favorites-list"></ul>
      </section>
    </main>
  </body>
</html>
