<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Quote of the Day</h1>

      <figure class="quote">
        <blockquote><p id="quote-text"></p></blockquote>
        <figcaption id="quote-author"></figcaption>
      </figure>

      <div class="actions">
        <button type="button" id="new-quote">New quote</button>
        <button type="button" id="favorite-toggle" aria-pressed="false" aria-label="Favorite">
          ☆ Favorite
        </button>
      </div>

      <section class="favorites" aria-labelledby="favorites-heading">
        <h2 id="favorites-heading">Favorites</h2>
        <p id="storage-notice" role="status" hidden>
          Favorites can't be saved in this browser and will be lost when you reload.
        </p>
        <p id="favorites-empty">No favorites yet</p>
        <ul id="favorites-list"></ul>
      </section>
    </main>
  </body>
</html>
